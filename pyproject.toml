[project]
name = "ai-devsecops-agent"
version = "0.1.0"
description = "Model-agnostic DevSecOps agent: deterministic core, knowledge from a versioned library"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "pyyaml==6.0.3",
]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.uv]
package = true

[dependency-groups]
# Pinned exactly: a linter that changes version between a local run and CI produces findings nobody
# asked for, at the worst possible moment.
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.0",
    "types-pyyaml==6.0.12.20260724",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["agent", "tests"]

[tool.ruff.lint]
# `S` is the security ruleset. An agent that reports insecure code has no excuse for skipping the
# same checks on itself, and it makes every subprocess and network call an explicit decision.
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PTH", "C4", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and they deliberately run commands to prove the guards work.
"tests/*" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.14"
files = ["agent", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
