# Where the three kinds of persistence live. They are separate because losing each one means
# something different: the run record is audit, the cache only costs time, state changes behaviour.

# Immutable facts, keyed by ecosystem, package and version. In CI this path is what the platform
# cache restores and saves; a miss is normal and never an error.
fact_cache:
  path: .agent/cache
  enabled: true

# What a verification command downloads in order to run: the crate registry, the Go module cache,
# wheels. Deliberately not the machine's own home — a command is given a home directory of its own so
# that it cannot read the credentials a developer or a runner keeps in theirs — and deliberately not
# the fact cache, which is small and worth restoring everywhere; this one is large and disposable.
tool_cache:
  path: .agent/tools

# Counters the agent must remember between runs, such as consecutive failures of one source. Kept in
# a dedicated ref so it survives cache eviction, leaves the default branch untouched, and still has
# a history someone can read.
state:
  ref: refs/agent/state

# The run record is written under --run-dir and published as a CI artefact. Retention is the
# platform's default: this file names no duration so that nothing here contradicts the pipeline.
