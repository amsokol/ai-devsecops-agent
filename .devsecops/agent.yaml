# Agent overlay — ai-devsecops-agent
#
# This repository is also the agent's first product: the overlay here is what the agent reads when
# it reviews itself.

schema: 1

ecosystems:
  - ecosystems/python-uv
  - ecosystems/github-actions

hotspots:
  - agent
  - tests

quarantine:
  days: 7

verification:
  python-uv:
    - [uv, sync, --frozen]
    - [uv, run, ruff, check, .]
    - [uv, run, ruff, format, --check, .]
    - [uv, run, mypy]
    - [uv, run, pytest, -q]
