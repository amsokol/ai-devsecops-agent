# Which backend and model runs each role.
#
# A model is named as a pair: the backend decides which models exist, so "gpt-5" without a backend is
# not an address. Roles a run never reaches are never instantiated, so a binding for a backend whose
# SDK is not installed costs nothing until something needs it.
#
# What a role *requires* is not here — it follows from what the role's code does and lives in
# agent/roles.py. A binding whose backend cannot do what the role needs is refused at startup.
#
# One model everywhere for now. Choosing per role before the eval harness exists would be taste with a
# version number attached; the harness is what turns "this model is better at code" into a measurement.

roles:
  analyst:
    backend: cursor
    model: composer-2.5

  # No fixer binding yet: the Cursor adapter gives a session its own task directory and never the
  # repository, so it cannot change a tree. Adding one here today is a startup error rather than a
  # maintenance run that silently fixes nothing.

  # No intent binding yet either — waking on a human comment arrives with that role.

  # writer stays off: the report's text is written by the analyst that found the thing. A second
  # session per run costs money and adds a place where the prose and the findings disagree. It is
  # worth enabling when a measurement shows the analyst's wording is actually worse.

backends:
  cursor:
    # Confine the backend's own tools as well as ours. Not every machine can: a sandbox the
    # environment refuses to provide makes every session fail to start, and turning this off is then
    # a decision somebody made on purpose rather than a downgrade nobody noticed.
    sandbox: true
