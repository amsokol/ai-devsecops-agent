# Which tasks exist when maintaining the default branch.
#
# There is no diff here, so code work is scoped to the hotspots the overlay names and dependency
# work covers the full graph of every enabled ecosystem.

playbook: playbooks/maintain

triggers:
  - maintain-requested
  - maintain-scheduled

split_threshold_bytes: 400000

tasks:
  - capability: capabilities/code-quality
    when: hotspots-present

  - capability: capabilities/code-vuln
    when: hotspots-present

  - capability: capabilities/deps-outdated
    when: ecosystem-enabled
    per_ecosystem: true

  - capability: capabilities/deps-vuln
    when: ecosystem-enabled
    per_ecosystem: true
